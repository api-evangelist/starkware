- {name: starknet_getTransactionByBlockIdAndIndex, description: Transaction by block id and index}
- {name: starknet_getTransactionStatus, description: Transaction status}
- {name: starknet_getTransactionReceipt, description: Transaction receipt}
- {name: starknet_getStateUpdate, description: State update for a block}
- {name: starknet_getStorageAt, description: Contract storage value}
