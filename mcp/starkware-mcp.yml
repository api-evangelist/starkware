generated: '2026-07-21'
method: searched
status: published
source: https://github.com/starkware-libs/starknet-specs/tree/master/mcp
server:
  name: starknet
  description: >-
    Official StarkWare MCP (Model Context Protocol) server that exposes all
    Starknet JSON-RPC v0.10.2+ read and trace methods as agent tools, letting an
    assistant read blocks, transactions, state, classes, events, and traces from
    a live Starknet node. Ships in the starknet-specs repo with a Claude Code
    slash-command installer (/install-starknet-mcp).
  transport: stdio
  runtime: python
  entrypoint: mcp/server.py
  repository: https://github.com/starkware-libs/starknet-specs
  install: claude mcp add --env STARKNET_RPC_URL=<your-rpc-url> starknet -- python mcp/server.py
  config:
  - name: STARKNET_RPC_URL
    description: Starknet JSON-RPC endpoint URL (node implementing spec v0.10.2+).
    required: true
tools:
