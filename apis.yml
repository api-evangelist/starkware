apis:
- name: Starknet Node JSON-RPC API
  description: >-
    The Starknet full-node JSON-RPC API (OpenRPC), covering read methods
    (blocks, transactions, state, classes, events, fees), write methods
    (add invoke/declare/deploy-account transactions), trace methods, and a
    WebSocket subscription API for new heads, events, and transaction status.
    Spec version 0.10.4-rc.0.
  humanURL: https://docs.starknet.io/
  baseURL: https://docs.starknet.io/
  properties:
  - type: OpenRPC
    name: Starknet Read API (OpenRPC)
    url: openrpc/starkware-starknet_api_openrpc.json
  - type: OpenRPC
    name: Starknet Write API (OpenRPC)
    url: openrpc/starkware-starknet_write_api.json
  - type: OpenRPC
    name: Starknet Trace API (OpenRPC)
    url: openrpc/starkware-starknet_trace_api_openrpc.json
  - type: OpenRPC
    name: Starknet WebSocket API (OpenRPC)
    url: openrpc/starkware-starknet_ws_api.json
  - type: OpenRPC
    name: Starknet Executables API (OpenRPC)
    url: openrpc/starkware-starknet_executables.json
  - type: OpenRPC
    name: Starknet Metadata API (OpenRPC)
    url: openrpc/starkware-starknet_metadata.json
- name: Starknet Wallet JSON-RPC API
  description: >-
    The Starknet wallet JSON-RPC API (SNIP-based) that dApps use to talk to
    browser/extension wallets: request accounts, permissions, chain switching,
    typed-data signing, and submitting invoke/declare transactions.
  humanURL: https://docs.starknet.io/
  baseURL: https://docs.starknet.io/
  properties:
  - type: OpenRPC
    name: Starknet Wallet API (OpenRPC)
    url: openrpc/starkware-wallet_rpc.json
- name: Starknet Proving API
  description: >-
    The Starknet proving JSON-RPC API for submitting transactions to be proven
    by the STARK prover.
  humanURL: https://docs.starknet.io/
  baseURL: https://docs.starknet.io/
  properties:
  - type: OpenRPC
    name: Starknet Proving API (OpenRPC)
    url: openrpc/starkware-starknet_proving_api_openrpc.json
- name: StarkEx REST API
  description: >-
    StarkEx application-specific scaling engine REST API for spot and perpetual
    trading systems, exposing Gateway, Feeder Gateway, and Availability Gateway
    endpoints plus documented error codes.
  humanURL: http://docs.starkware.co/starkex/index.html
  baseURL: http://docs.starkware.co/starkex/index.html
