aid: starkware
name: Starkware
description: >-
  StarkWare Industries builds STARK-proof (Scalable Transparent ARgument of
  Knowledge) blockchain scaling technology for Ethereum. Its flagship products
  are Starknet, a permissionless decentralized validity-rollup (ZK-Rollup) where
  developers deploy Cairo smart contracts, and StarkEx, an application-specific
  scaling engine for exchanges (spot, perpetual, NFT, and payments). The
  developer surface centers on the Starknet Node JSON-RPC API (read, write,
  trace, and WebSocket methods specified in OpenRPC), a Wallet JSON-RPC API, a
  Proving API, StarkEx REST gateways, first-party SDKs (starknet.js, starknet.py,
  starkex-js), the starkli CLI, and the Cairo programming language and prover
  stack (Stwo, Cairo VM). This profile catalogs those machine-readable specs and
  developer artifacts for the API Evangelist network.
