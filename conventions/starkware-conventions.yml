authentication:
  summary: No API-level auth in spec; node/provider-specific. See authentication/starkware-authentication.yml
idempotency:
  supported: false
  notes: >-
    Starknet does not use an idempotency-key header. Replay protection and
    exactly-once semantics for write transactions are provided by the account
    nonce (starknet_getNonce); resubmitting a transaction with the same nonce is
    rejected (error 59 DUPLICATE_TX / 52 INVALID_TRANSACTION_NONCE).
