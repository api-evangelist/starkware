  style: cursor
  applies_to: [starknet_getEvents]
  request_fields:
  - chunk_size (max page size; error 31 PAGE_SIZE_TOO_BIG if exceeded)
  - continuation_token (opaque cursor; error 33 INVALID_CONTINUATION_TOKEN if invalid)
  response_fields:
  - events
  - continuation_token
block_references:
  parameter: block_id
  forms:
  - block_hash (0x-prefixed felt)
  - block_number (integer)
  - block_tag ("latest" | "pre_confirmed")
identifiers:
  felt: FELT (field element, 0x-prefixed hex < Stark prime)
  address: ADDRESS / contract address (felt)
  txn_hash: TXN_HASH (felt)
  chain_id: CHAIN_ID (0x-prefixed hex, e.g. SN_MAIN=0x534e5f4d41494e, SN_SEPOLIA=0x534e5f5345504f4c4941)
